<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator — Mongil Tools</title>
    <link rel="stylesheet" href="../../../theme.css" />
    <link rel="stylesheet" href="../../theme.css" />
    <script>
        (function () {
          const saved = localStorage.getItem("theme");
          if (saved === "dark" || saved === "light") {
            document.documentElement.dataset.theme = saved;
          }
        })();
    </script>
    <style>
        .calc-box {
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 8px;
          padding: 1.25rem;
          display: grid;
          gap: 0.9rem;
          max-width: 480px;
        }

        .calc-row {
          display: grid;
          grid-template-columns: 1fr auto 1fr;
          gap: 0.5rem;
          align-items: center;
        }

        .calc-box input,
        .calc-box select {
          background: var(--bg);
          color: var(--text);
          border: 1px solid var(--border);
          border-radius: 6px;
          padding: 0.5rem 0.65rem;
          font-size: 0.95rem;
          width: 100%;
        }

        .calc-result {
          padding-top: 0.6rem;
          border-top: 1px solid var(--border);
          font-size: 1rem;
          color: var(--muted);
        }

        .calc-result strong {
          color: var(--text);
        }
    </style>
</head>
<body>
<header>
    <div class="container">
        <nav>
            <div class="nav-left">
                <button class="sidebar-btn" type="button" data-sidebar-toggle>Menu</button>
                <a class="hub-brand" href="../">Tools</a>
            </div>
            <div class="nav-right"></div>
        </nav>
    </div>
</header>

<main class="container">
    <section class="hub-hero">
        <span class="hub-badge">Calculator</span>
        <h1>Basic Calculator</h1>
        <div class="hub-game-title" data-game-name>Mongil: Star Dive</div>
        <p class="hub-subtitle">Simple starter calculator layout—swap in game formulas whenever you're ready.</p>
    </section>

    <section class="hub-section">
        <div class="calc-box">
            <div class="calc-row">
                <input id="numA" type="number" value="100" step="any" aria-label="First value" />
                <select id="op" aria-label="Operation">
                    <option value="add">+</option>
                    <option value="sub">-</option>
                    <option value="mul">×</option>
                    <option value="div">÷</option>
                </select>
                <input id="numB" type="number" value="25" step="any" aria-label="Second value" />
            </div>
            <div class="calc-result">
                Result: <strong id="calcOutput">125</strong>
            </div>
        </div>
    </section>
</main>

<footer>
    <div class="container">
        <p data-footer-text>Built with HTML &amp; CSS on Cloudflare.</p>
    </div>
</footer>

<div class="sidebar-backdrop" data-sidebar-backdrop></div>

<aside class="sidebar" data-sidebar aria-hidden="true">
    <div class="sidebar-inner">
        <div class="sidebar-header">
            <strong data-sidebar-title>Mongil Hub</strong>
            <button class="sidebar-btn" type="button" data-sidebar-close>✕</button>
        </div>
        <nav class="sidebar-nav" aria-label="Calculator navigation">
            <a class="sidebar-link" href="../" data-back-to-tools>← Tools Hub</a>
            <a class="sidebar-link" href="../../" data-back-to-mongil>← Mongil Hub</a>
            <a class="sidebar-link" href="./">Calculator</a>
        </nav>
        <div class="sidebar-divider">
            <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">
                Theme
            </button>
            <a class="sidebar-link" href="../../../" data-link="home" data-back-to-main>← Main Site</a>
        </div>
    </div>
</aside>

<script src="../../../config.js"></script>
<script src="../../config.js"></script>
<script>
    const numA = document.getElementById("numA");
    const numB = document.getElementById("numB");
    const op = document.getElementById("op");
    const output = document.getElementById("calcOutput");

    function compute() {
      const a = parseFloat(numA.value) || 0;
      const b = parseFloat(numB.value) || 0;
      let val = 0;

      if (op.value === "add") val = a + b;
      else if (op.value === "sub") val = a - b;
      else if (op.value === "mul") val = a * b;
      else if (op.value === "div") val = b === 0 ? "Cannot divide by 0" : a / b;

      output.textContent = typeof val === "number" ? String(Number(val.toFixed(6))) : val;
    }

    [numA, numB, op].forEach((el) => el.addEventListener("input", compute));
    compute();

    SITE_CONFIG.initPage();
</script>
</body>
</html>
