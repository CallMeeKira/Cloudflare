<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-mongil-site-name>Mongil Database</title>
  <link rel="stylesheet" href="../theme.css" />
  <link rel="stylesheet" href="./theme.css" />
  <script>
    (function () {
      const saved = localStorage.getItem("theme");
      if (saved === "dark" || saved === "light") {
        document.documentElement.dataset.theme = saved;
      }
    })();
  </script>
</head>
<body>
<header>
  <div class="container">
    <nav>
      <div class="nav-left">
        <button class="sidebar-btn" type="button" data-sidebar-toggle>Menu</button>
        <a class="hub-brand" href="./" data-mongil-site-name>Mongil Database</a>
      </div>
      <div class="nav-right"></div>
    </nav>
  </div>
</header>

<main class="container" id="overview">
  <section class="hub-hero">
    <span class="hub-badge" data-hub-badge>Database Hub</span>
    <h1 data-hub-title>Mongil Database</h1>
    <div class="hub-game-title" data-game-name>Mongil: Star Dive</div>
    <p class="hub-subtitle" data-mongil-subtitle>
      Game database, guides &amp; quick reference for Mongil: Star Dive.
    </p>
  </section>

  <div id="hubSections"></div>
</main>

<footer>
  <div class="container">
    <p data-footer-text>Built with HTML &amp; CSS on Cloudflare.</p>
  </div>
</footer>

<div class="sidebar-backdrop" data-sidebar-backdrop></div>

<aside class="sidebar" data-sidebar aria-hidden="true">
  <div class="sidebar-inner">
    <div class="sidebar-header">
      <strong data-sidebar-title>Mongil Hub</strong>
      <button class="sidebar-btn" type="button" data-sidebar-close>✕</button>
    </div>
    <nav class="sidebar-nav" id="hubSidebarNav" aria-label="Subdomain navigation"></nav>
    <div class="sidebar-divider">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">
        Theme
      </button>
      <a class="sidebar-link" href="../" data-link="home" data-back-to-main>← Main Site</a>
    </div>
  </div>
</aside>

<script src="../config.js"></script>
<script src="./config.js"></script>
<script>
  const badgeEl = document.querySelector("[data-hub-badge]");
  if (badgeEl && MONGIL_CONFIG.hero?.badge) {
    badgeEl.textContent = MONGIL_CONFIG.hero.badge;
  }

  const titleEl = document.querySelector("[data-hub-title]");
  if (titleEl && MONGIL_CONFIG.hero?.title) {
    titleEl.textContent = MONGIL_CONFIG.hero.title;
  }

  const sidebarNavEl = document.getElementById("hubSidebarNav");
  if (sidebarNavEl && Array.isArray(MONGIL_CONFIG.sidebarLinks)) {
    sidebarNavEl.innerHTML = "";
    MONGIL_CONFIG.sidebarLinks.forEach((item) => {
      const a = document.createElement("a");
      a.className = "sidebar-link";
      a.href = item.href;
      a.textContent = item.label;
      a.addEventListener("click", () => SITE_CONFIG.sidebar.close());
      sidebarNavEl.appendChild(a);
    });
  }

  const sectionsContainer = document.getElementById("hubSections");
  if (sectionsContainer && Array.isArray(MONGIL_CONFIG.sections)) {
    sectionsContainer.innerHTML = "";
    MONGIL_CONFIG.sections.forEach((sec) => {
      const sectionEl = document.createElement("section");
      sectionEl.className = "hub-section";
      if (sec.id) sectionEl.id = sec.id;

      const headerEl = document.createElement("div");
      headerEl.className = "hub-section-header";

      const h2 = document.createElement("h2");
      h2.textContent = sec.title;
      headerEl.appendChild(h2);

      if (sec.description) {
        const p = document.createElement("p");
        p.textContent = sec.description;
        headerEl.appendChild(p);
      }

      const gridEl = document.createElement("div");
      gridEl.className = "hub-grid";

      (sec.cards || []).forEach((card) => {
        const a = document.createElement("a");
        a.className = "hub-card";
        a.href = card.href || "#";

        const topRow = document.createElement("div");
        topRow.className = "hub-card-top";

        const h3 = document.createElement("h3");
        h3.textContent = card.title;
        topRow.appendChild(h3);

        if (card.status) {
          const tag = document.createElement("span");
          tag.className = "hub-card-tag";
          tag.textContent = card.status;
          topRow.appendChild(tag);
        }

        const desc = document.createElement("p");
        desc.textContent = card.summary;

        a.appendChild(topRow);
        a.appendChild(desc);
        gridEl.appendChild(a);
      });

      sectionEl.appendChild(headerEl);
      sectionEl.appendChild(gridEl);
      sectionsContainer.appendChild(sectionEl);
    });
  }

  SITE_CONFIG.initPage();
</script>
</body>
</html>
