<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-mongil-site-name>Mongil Database</title>
  <link rel="stylesheet" href="../theme.css" />
  <script>
    (function () {
      const saved = localStorage.getItem("theme");
      if (saved === "dark" || saved === "light") {
        document.documentElement.dataset.theme = saved;
      }
    })();
  </script>
  <style>
    a {
      color: var(--accent);
      text-decoration: none;
    }

    .nav-left,
    .nav-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .theme-toggle,
    .sidebar-btn {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.35rem 0.7rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .theme-toggle:hover,
    .sidebar-btn:hover {
      border-color: var(--accent);
    }

    .sidebar-inner {
      padding: 1.25rem;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.75rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-top: 2.5rem;
    }

    .box p {
      color: var(--muted);
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <nav>
        <div class="nav-left">
          <button class="sidebar-btn" type="button" data-sidebar-toggle>Menu</button>
          <a href="../" data-link="home" data-back-to-main>← Main Site</a>
        </div>
        <div class="nav-right">
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">
            Theme
          </button>
        </div>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="box">
      <h1 data-mongil-site-name>Mongil Database</h1>
      <p data-game-name>Mongil: Star Dive</p>
      <p data-mongil-subtitle>Game database &amp; notes for Mongil: Star Dive</p>
    </div>
  </main>

  <div class="sidebar-backdrop" data-sidebar-backdrop></div>

  <aside class="sidebar" data-sidebar aria-hidden="true">
    <div class="sidebar-inner">
      <div class="sidebar-header">
        <strong data-mongil-site-name>Mongil Database</strong>
        <button class="sidebar-btn" type="button" data-sidebar-close>✕</button>
      </div>
      <!-- Sidebar content goes here later -->
    </div>
  </aside>

  <script src="../config.js"></script>
  <script src="./config.js"></script>
  <script>
    const links = SITE_CONFIG.getLinks();
    const storageKey = SITE_CONFIG.theme?.storageKey || "theme";

    if (SITE_CONFIG.lang) {
      document.documentElement.lang = SITE_CONFIG.lang;
    }

    document.querySelectorAll("[data-mongil-site-name]").forEach((el) => {
      el.textContent = SITE_CONFIG.mongilSiteName;
    });

    document.querySelectorAll("[data-game-name]").forEach((el) => {
      el.textContent = MONGIL_CONFIG.gameName;
    });

    document.querySelectorAll("[data-mongil-subtitle]").forEach((el) => {
      el.textContent = MONGIL_CONFIG.subtitle;
    });

    document.querySelectorAll("[data-back-to-main]").forEach((el) => {
      el.textContent = MONGIL_CONFIG.labels.backToMain;
    });

    document.querySelectorAll("[data-link]").forEach((el) => {
      const key = el.dataset.link;
      if (links[key]) {
        el.setAttribute("href", links[key]);
      }
    });

    SITE_CONFIG.sidebar.init();

    const root = document.documentElement;
    const toggleBtn = document.getElementById("themeToggle");
    toggleBtn.setAttribute("aria-label", SITE_CONFIG.labels.themeAriaLabel);

    function isDarkActive() {
      if (root.dataset.theme === "dark") return true;
      if (root.dataset.theme === "light") return false;
      return window.matchMedia("(prefers-color-scheme: dark)").matches;
    }

    function updateButtonLabel() {
      toggleBtn.textContent = isDarkActive()
        ? SITE_CONFIG.labels.lightMode
        : SITE_CONFIG.labels.darkMode;
    }

    toggleBtn.textContent = SITE_CONFIG.labels.themeButton;
    updateButtonLabel();

    toggleBtn.addEventListener("click", () => {
      const nextTheme = isDarkActive() ? "light" : "dark";
      root.dataset.theme = nextTheme;
      localStorage.setItem(storageKey, nextTheme);
      updateButtonLabel();
    });
  </script>
</body>
</html>
